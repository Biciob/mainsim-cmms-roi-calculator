    <meta charset="UTF-8" />

    <title>Mainsim ROI Engineer</title>
    <!-- Nota: In produzione su Vercel è consigliato installare Tailwind via npm, ma la CDN funziona per deploy rapidi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
      }
      
      /* Utility class for PDF generation to prevent cutting elements */
      .pdf-break-inside-avoid {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      @media print {
        /* General Reset */
        *, *::before, *::after {
          text-shadow: none !important;
          box-shadow: none !important;
          animation: none !important;
          transition: none !important;
        }
        
        body {
          background-color: white !important;
          color: black !important;
          font-size: 12pt;
        }

        /* Hiding UI Elements */
        .no-print {
          display: none !important;
        }

        /* Layout Fixes */
        .max-w-5xl {
          max-width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        
        /* Ensuring Text Visibility */
        .prose {
          max-width: none !important; 
          color: black !important;
        }
        .prose * {
          color: black !important;
        }
        
        /* Overflow fixes to prevent cutting off text */
        .overflow-hidden {
          overflow: visible !important;
        }
        
        /* Page Breaks */
        .print-break-before {
          page-break-before: always;
        }
        
        h1, h2, h3 {
          page-break-after: avoid;
        }
        
        p, li {
          orphans: 3; 
          widows: 3;
        }
        
        /* Remove card styles for cleaner print */
        .shadow-xl, .shadow-lg, .shadow-md, .shadow-sm {
          box-shadow: none !important;
          border: 1px solid #ddd !important;
        }
        
        /* Force background printing for charts/bars if browser allows */
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    </style>
